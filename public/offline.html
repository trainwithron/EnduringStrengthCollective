<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1c1b1a; color: #f3f0eb; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
  main { max-width: 22rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
  p { color: #b9b4ab; line-height: 1.5; margin: 0 0 1.25rem; }
  button { min-height: 44px; padding: 0 20px; border: 1px solid #c8102e; background: transparent; color: #f3f0eb; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Sets you already logged on this phone are safe and upload when you're back online. A workout you opened earlier still opens from Home.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
